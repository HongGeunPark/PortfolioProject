version: "3.8"

services:
  # ASP.NET Core API
  api:
    build:
      context: ./PortfolioProjectWeb_Backend/PortfolioProjectWeb
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db

  # Vue.js
  frontend:
    build:
      context: ./PortfolioProjectWeb_Frontend/PortfolioProjectWeb
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

  # MS-SQL Server
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Your_Password123
    volumes:
      - sqldata:/var/lib/sqlserver/data

volumes:
  sqldata:
